name: CI - DAST API scanning
on:
  push:
    branches: [ step5 ]
    paths:
     - 'rest-api-goat/py-web/Dockerfile'
     - 'rest-api-goat/Dockerfile'
     - 'rest-api-goat/.dockerignore'
     - 'rest-api-goat/zap-api-scan.sh'
     - 'rest-api-goat/docker-compose.yaml'
     - '.github/workflows/api-scanning.yml'
  pull_request:
    branches: [ step5 ]
    paths:
     - 'rest-api-goat/py-web/Dockerfile'
     - 'rest-api-goat/Dockerfile'
     - 'rest-api-goat/.dockerignore'
     - 'rest-api-goat/zap-api-scan.sh'
     - 'rest-api-goat/docker-compose.yaml'
     - '.github/workflows/api-scanning.yml'

env:
  ## Sets environment variables
  ENV: "dev"
  DELETE_FLAG: "true"
  TARGET_API_DEF: "py-web/openapi.json"
  API_REPORT_FILE: "api_report.json"
  APP_DIR: "rest-api-goat"
  REPORT_FOLDER: "reports"

jobs:
  docker:
    runs-on: ubuntu-latest
    # Least privilege: read the code, and let the ZAP action open an issue with its report
    permissions:
      contents: read
      issues: write

    steps:
    # Checks-out our repository
    - name: Checkout
      uses: actions/checkout@v2
    
    # Cleanup
    - name: Cleanup
      run: |-
        pushd "${{env.APP_DIR}}"
        if [ "${{env.DELETE_FLAG}}" == "true" ]
        then
          docker compose rm -f web
          docker compose rm -f py-web
        fi
        popd

    # Run REST API Goat
    - name: Run-API
      run: |-
        pushd "${{env.APP_DIR}}"
        docker compose build --no-cache web
        docker compose up -d web
        docker compose logs web
        popd
        
    # Serve Goat OpenAPI definition
    - name: Serve-API-Definition
      run: |-
        pushd "${{env.APP_DIR}}"
        docker compose build --no-cache py-web
        docker compose up -d py-web
        docker compose logs py-web
        popd

    # Wait until the API and the OpenAPI definition answer before scanning
    - name: Wait-for-API
      run: |-
        for url in http://localhost:5000/get_customers http://localhost:9999/openapi.json; do
          curl --retry 10 --retry-delay 3 --retry-all-errors -s -o /dev/null "$url"
        done
        
    # Launch API scan
    - name: Scan-API
      uses: zaproxy/action-api-scan@v0.9.0
      with:
        docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        format: openapi
        # Scan the definition served by py-web; -O rewrites the spec's http://web:5000
        # (a name that only resolves inside the compose network) to the published port
        target: http://localhost:9999/openapi.json
        cmd_options: -O localhost:5000 -z "-config replacer.full_list(0).description=content" -z "-config replacer.full_list(0).enabled=true" -z "-config replacer.full_list(0).matchtype=REQ_HEADER" -z "-config replacer.full_list(0).matchstr=Content-Type" -z "-config replacer.full_list(0).regex=false" -z "-config replacer.full_list(0).replacement='application/octet-stream'" -z "-config replacer.full_list(0).description=accept" -z "-config replacer.full_list(0).enabled=true" -z "-config replacer.full_list(0).matchtype=REQ_HEADER" -z "-config replacer.full_list(0).matchstr=Accept" -z "-config replacer.full_list(0).regex=false" -z "-config replacer.full_list(0).replacement='application\/json'" -z "-config replacer.full_list(0).description=auth1" -z "-config replacer.full_list(0).enabled=true" -z "-config replacer.full_list(0).matchtype=REQ_HEADER" -z "-config replacer.full_list(0).matchstr=X-API-Token" -z "-config replacer.full_list(0).regex=false" -z "-config replacer.full_list(0).replacement=${api_key}"